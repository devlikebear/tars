sonar.projectName=TARS
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=**/*_test.go,frontend/console/tests/**,**/node_modules/**,**/dist/**,internal/tarsserver/consoleassets/dist/**,dist/**,bin/**,coverage*.out,workspace/**,docs/brand/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go,frontend/console/tests/**/*.test.ts

sonar.go.coverage.reportPaths=coverage.out

# Coverage exclusions are for files with no logic to cover, not for code we
# would rather not test.
#
#   **/alias.go                 compatibility shims from the pkg/* inversion
#                               (#928): package-level `X = pkgfoo.X` bindings,
#                               which Go's cover tool does not instrument, so
#                               they report as permanently uncovered lines.
#   internal/architecture/**    the layer declaration is three string slices;
#                               its rules are enforced by layers_test.go,
#                               which is itself a test and thus excluded.
#   pkg/llm/claude_code_cli_windows.go
#                               platform-split file the Linux-only coverage
#                               job cannot execute. Moved here from
#                               internal/llm by #928 — the old path had gone
#                               stale and was silently matching nothing.
# Duplication exclusions are for files that repeat by design.
#
#   frontend/console/src/i18n/**
#                               one dictionary per locale with identical keys.
#                               CPD ignores string literals, so every key
#                               added to en.ts and ko.ts reads as a duplicate
#                               block. The files are still analyzed for
#                               everything else.
sonar.cpd.exclusions=frontend/console/src/i18n/**

sonar.coverage.exclusions=frontend/console/**,docs/**,scripts/**,**/*_test.go,**/alias.go,internal/architecture/**,pkg/llm/claude_code_cli_windows.go
