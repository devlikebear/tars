name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run security scan
        run: make security-scan

  windows-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cross-compile the module for Windows
        run: make windows-build-check

  windows-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # The repository's scripts are POSIX sh; bash ships with the runner's
        # git installation. Without this, steps would run under PowerShell.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Invoked directly rather than through make: GNU Make is not guaranteed
      # on the Windows runner image, and the script is what developers run
      # locally anyway.
      - name: Run Go tests on Windows
        run: ./scripts/windows_test.sh

  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/console/package-lock.json

      - name: Install browser runtime dependencies
        run: npm ci --ignore-scripts

      - name: Check frontend console
        run: cd frontend/console && npm ci --ignore-scripts

      - name: Run frontend console checks
        run: cd frontend/console && npm run check

      - name: Run frontend console tests
        run: cd frontend/console && npm run test:ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: make test-cover-check

      - name: Run deterministic agent harness scenarios
        run: make agent-harness-eval

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  pr-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/console/package-lock.json

      - name: Check frontend console
        run: cd frontend/console && npm ci --ignore-scripts

      - name: Run frontend console checks
        run: cd frontend/console && npm run check

      - name: Run frontend console tests
        run: cd frontend/console && npm run test:ci

      - name: Check the public API snapshot
        run: make api-check

      - name: Lint changed Go code
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD: HEAD
        run: make lint-diff

      - name: Test changed Go packages with diff coverage
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD: HEAD
        run: make test-cover-diff

      - name: Run deterministic agent harness scenarios
        run: make agent-harness-eval
