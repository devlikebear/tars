name: codeql

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "37 2 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Same classifier as ci.yml: a pull request that touches only documentation
  # has nothing to analyze. Pushes to main and the weekly scan always run, so
  # every commit on main has an analysis for later pull requests to compare
  # against.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: ./scripts/ci_changes.sh

  # The three "Analyze (...)" checks are required, and a matrix job skipped
  # with a job-level `if` never expands its matrix, so those names would not
  # report and the merge would wait forever. The job therefore always runs and
  # skips its steps instead.
  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: ${{ !cancelled() }}
    env:
      ANALYZE: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # A manual build of the root module only. The autobuilder also built
          # desktop/, whose webview needs GTK and WebKitGTK headers from apt;
          # on slow mirror days that install alone ran past this job's 20
          # minutes and blocked every pull request. desktop/ is analyzed by
          # analyze-desktop below instead.
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        if: env.ANALYZE == 'true'
        uses: actions/checkout@v6

      - name: Set up Go
        if: env.ANALYZE == 'true' && matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Initialize CodeQL
        if: env.ANALYZE == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: env.ANALYZE == 'true' && matrix.build-mode == 'manual'
        run: go build ./...

      - name: Perform CodeQL Analysis
        if: env.ANALYZE == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # The desktop shell (desktop/, its own Go module) needs the webview headers
  # to build, so it gets its own job: not a required check, run on pushes to
  # main, the weekly scan, and pull requests that change what desktop/ is
  # built from. A slow apt mirror then delays only this job, and its own
  # timeout stops it from waiting forever.
  analyze-desktop:
    name: Analyze (go, desktop)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.desktop != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Install webview headers
        timeout-minutes: 30
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build
        working-directory: desktop
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go-desktop"
