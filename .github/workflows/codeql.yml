name: codeql

on:
  push:
    branches:
      - main
      # TEMPORARY, remove before merge: pull request scans report only the
      # changed lines, so the model pack can only be judged on a full scan.
      - chore/codeql-path-barriers
  pull_request:
    branches:
      - main
  schedule:
    - cron: "37 2 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Same classifier as ci.yml: a pull request that touches only documentation
  # has nothing to analyze. Pushes to main and the weekly scan always run, so
  # every commit on main has an analysis for later pull requests to compare
  # against.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: ./scripts/ci_changes.sh

  # The three "Analyze (...)" checks are required, and a matrix job skipped
  # with a job-level `if` never expands its matrix, so those names would not
  # report and the merge would wait forever. The job therefore always runs and
  # skips its steps instead.
  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: ${{ !cancelled() }}
    env:
      ANALYZE: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        if: env.ANALYZE == 'true'
        uses: actions/checkout@v6

      # The Go autobuilder builds every module it finds, desktop/ included,
      # and the desktop shell's webview needs these headers to compile.
      - name: Install webview headers
        if: env.ANALYZE == 'true' && matrix.language == 'go'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Initialize CodeQL
        if: env.ANALYZE == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: env.ANALYZE == 'true' && matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: env.ANALYZE == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
