name: release-on-version-bump

on:
  push:
    branches:
      - main
    paths:
      - VERSION.txt
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Require CHANGELOG update in release push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git show --pretty='' --name-only HEAD)"
          else
            changed_files="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")"
          fi
          printf '%s\n' "${changed_files}"
          if ! printf '%s\n' "${changed_files}" | grep -Fxq 'CHANGELOG.md'; then
            echo "release pushes must update CHANGELOG.md together with VERSION.txt" >&2
            exit 1
          fi

      - name: Validate release bundle
        id: release
        run: |
          set -euo pipefail
          version="$(go run ./cmd/releasectl validate-release --version-file VERSION.txt --changelog CHANGELOG.md)"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'tag_name=v%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Ensure existing tag, if any, points at this commit
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if ! git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            exit 0
          fi
          remote_tag_commit="$(git rev-list -n 1 "refs/tags/v${VERSION}")"
          if [ "${remote_tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "tag v${VERSION} already exists on ${remote_tag_commit}" >&2
            exit 1
          fi

  build-assets:
    needs: prepare-release
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build console assets
        run: make console-build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release archives
        run: |
          set -euo pipefail
          for release_goarch in arm64 amd64; do
            make release-asset RELEASE_GOOS=darwin RELEASE_GOARCH="${release_goarch}" DIST_DIR=dist
          done
          # Cross-compiled with CGO off like the darwin builds; verified by
          # running it in verify-windows-asset.
          make release-asset RELEASE_GOOS=windows RELEASE_GOARCH=amd64 DIST_DIR=dist

      - name: Verify archive version outputs
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          for release_goarch in arm64 amd64; do
            archive="dist/tars_${VERSION}_darwin_${release_goarch}.tar.gz"
            test -f "${archive}"
            rm -rf dist/check
            mkdir -p dist/check
            tar -xzf "${archive}" -C dist/check
            dist/check/tars --version | grep -F "tars ${VERSION} ("
          done

      - name: Upload archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The Windows server archive is built on macOS, so run it on Windows before
  # publishing, and install it with install.ps1 the way users will.
  verify-windows-asset:
    needs:
      - prepare-release
      - build-assets
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist

      - name: Install with install.ps1 and check the version
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "dist/tars_${env:VERSION}_windows_amd64.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -LiteralPath dist/checksums.txt -Encoding ascii
          $dir = Join-Path $env:RUNNER_TEMP 'tars-install'
          # Windows PowerShell 5.1 is what `irm | iex` runs in on a stock machine.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -Version $env:VERSION -ArchivePath $archive -ChecksumsPath dist/checksums.txt -InstallDir $dir -NoPath
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed with exit code $LASTEXITCODE" }
          $reported = & (Join-Path $dir 'tars.exe') --version
          if (-not ("$reported" -like "tars $env:VERSION (*")) { throw "unexpected version output: $reported" }
          $reported

  # Desktop shell archives. The self-updater picks tars-desktop_* assets out
  # of the same release and verifies them against checksums.txt.
  build-desktop-macos:
    needs: prepare-release
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # Without a Developer ID signature and a notarization ticket, Gatekeeper
      # refuses the downloaded app (and the Homebrew cask, which installs it
      # quarantined). The secret names match devlikebear/linetta's.
      - name: Check Apple signing secrets
        id: apple_signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_BASE64 KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Apple signing secrets missing (${missing[*]}): the macOS desktop app is ad-hoc signed and Gatekeeper will refuse it once downloaded."
          fi

      - name: Import Apple signing assets
        id: apple_assets
        if: steps.apple_signing.outputs.configured == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/tars-signing.keychain-db"
          cert_path="${RUNNER_TEMP}/developer-id.p12"
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${cert_path}"
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 --decode > "${key_path}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security default-keychain -s "${keychain}"
          security list-keychains -d user -s "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security import "${cert_path}" -k "${keychain}" -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${keychain}"
          security find-identity -v -p codesigning "${keychain}"
          rm -f "${cert_path}"
          echo "api_key_path=${key_path}" >> "${GITHUB_OUTPUT}"

      - name: Package the app bundles
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          DESKTOP_CODESIGN_IDENTITY: ${{ steps.apple_signing.outputs.configured == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          DESKTOP_NOTARY_KEY_PATH: ${{ steps.apple_assets.outputs.api_key_path }}
          DESKTOP_NOTARY_KEY_ID: ${{ steps.apple_signing.outputs.configured == 'true' && secrets.APPLE_API_KEY || '' }}
          DESKTOP_NOTARY_ISSUER: ${{ steps.apple_signing.outputs.configured == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          set -euo pipefail
          for desktop_goarch in arm64 amd64; do
            ./scripts/desktop_package.sh darwin "${desktop_goarch}" "${VERSION}" dist
          done
          tar -xzf "dist/tars-desktop_${VERSION}_darwin_arm64.tar.gz" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/TARS.app/Contents/MacOS/TARS" --version | grep -F "tars-desktop ${VERSION} "

      - name: Remove signing assets
        if: always() && steps.apple_assets.outcome == 'success'
        run: |
          rm -f "${RUNNER_TEMP}/AuthKey.p8"
          security delete-keychain "${RUNNER_TEMP}/tars-signing.keychain-db" || true

      - name: Upload desktop archives
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-macos
          path: dist/tars-desktop_*
          if-no-files-found: error

  build-desktop-linux-windows:
    needs: prepare-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Install webview headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Package for Linux and Windows
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/desktop_package.sh linux amd64 "${VERSION}" dist
          ./scripts/desktop_package.sh windows amd64 "${VERSION}" dist

      - name: Upload desktop archives
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-linux-windows
          path: dist/tars-desktop_*
          if-no-files-found: error

  publish-release:
    needs:
      - prepare-release
      - build-assets
      - verify-windows-asset
      - build-desktop-macos
      - build-desktop-linux-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.checksums.outputs.version }}
      arm64_sha: ${{ steps.checksums.outputs.arm64_sha }}
      amd64_sha: ${{ steps.checksums.outputs.amd64_sha }}
      desktop_arm64_sha: ${{ steps.checksums.outputs.desktop_arm64_sha }}
      desktop_amd64_sha: ${{ steps.checksums.outputs.desktop_amd64_sha }}
      windows_sha: ${{ steps.checksums.outputs.windows_sha }}
      desktop_windows_sha: ${{ steps.checksums.outputs.desktop_windows_sha }}
    steps:
      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Compute checksums
        id: checksums
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          arm64_asset="dist/tars_${VERSION}_darwin_arm64.tar.gz"
          amd64_asset="dist/tars_${VERSION}_darwin_amd64.tar.gz"
          arm64_sha="$(shasum -a 256 "${arm64_asset}" | awk '{print $1}')"
          amd64_sha="$(shasum -a 256 "${amd64_asset}" | awk '{print $1}')"
          # Every server (tars_*) and desktop (tars-desktop_*) archive; install.ps1
          # and the desktop updater refuse an archive missing from this list.
          for asset in dist/tars_* dist/tars-desktop_*; do
            printf '%s  %s\n' "$(shasum -a 256 "${asset}" | awk '{print $1}')" "$(basename "${asset}")"
          done > dist/checksums.txt
          grep -Fq "  tars_${VERSION}_windows_amd64.zip" dist/checksums.txt
          printf 'version=%s\n' "${VERSION}" >> "${GITHUB_OUTPUT}"
          printf 'arm64_sha=%s\n' "${arm64_sha}" >> "${GITHUB_OUTPUT}"
          printf 'amd64_sha=%s\n' "${amd64_sha}" >> "${GITHUB_OUTPUT}"
          printf 'desktop_arm64_sha=%s\n' "$(shasum -a 256 "dist/tars-desktop_${VERSION}_darwin_arm64.tar.gz" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          printf 'desktop_amd64_sha=%s\n' "$(shasum -a 256 "dist/tars-desktop_${VERSION}_darwin_amd64.tar.gz" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          printf 'windows_sha=%s\n' "$(shasum -a 256 "dist/tars_${VERSION}_windows_amd64.zip" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          printf 'desktop_windows_sha=%s\n' "$(shasum -a 256 "dist/tars-desktop_${VERSION}_windows_amd64.zip" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          printf 'Release %s\n\nSee CHANGELOG.md for details.\n' "${TAG_NAME}" > release-notes.txt
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
            gh release edit "${TAG_NAME}" --title "${TAG_NAME}" --notes-file release-notes.txt
          else
            gh release create "${TAG_NAME}" dist/*.tar.gz dist/*.zip dist/checksums.txt --target "${GITHUB_SHA}" --title "${TAG_NAME}" --notes-file release-notes.txt
          fi

  update-homebrew:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout TARS repository
        uses: actions/checkout@v6
        with:
          path: repo

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: repo/go.mod
          cache: false

      - name: Require tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN is required to update devlikebear/homebrew-tap" >&2
            exit 1
          fi

      - name: Checkout Homebrew tap repository
        uses: actions/checkout@v6
        with:
          repository: devlikebear/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # The tars-desktop cask depends on the tars formula, so
      # `brew install --cask devlikebear/tap/tars-desktop` installs both.
      - name: Render formula and cask
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
          ARM64_SHA: ${{ needs.publish-release.outputs.arm64_sha }}
          AMD64_SHA: ${{ needs.publish-release.outputs.amd64_sha }}
          DESKTOP_ARM64_SHA: ${{ needs.publish-release.outputs.desktop_arm64_sha }}
          DESKTOP_AMD64_SHA: ${{ needs.publish-release.outputs.desktop_amd64_sha }}
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p ../homebrew-tap/Formula ../homebrew-tap/Casks
          go run ./cmd/releasectl homebrew-formula \
            --repo devlikebear/tars \
            --version "${VERSION}" \
            --arm64-sha "${ARM64_SHA}" \
            --amd64-sha "${AMD64_SHA}" \
            > ../homebrew-tap/Formula/tars.rb
          go run ./cmd/releasectl homebrew-cask \
            --repo devlikebear/tars \
            --version "${VERSION}" \
            --arm64-sha "${DESKTOP_ARM64_SHA}" \
            --amd64-sha "${DESKTOP_AMD64_SHA}" \
            > ../homebrew-tap/Casks/tars-desktop.rb

      - name: Commit and push formula update
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tars.rb Casks/tars-desktop.rb
          if git diff --cached --quiet; then
            echo "formula and cask already up to date"
            exit 0
          fi
          git commit -m "tars ${{ needs.publish-release.outputs.version }}"
          git push origin HEAD:main

  # microsoft/winget-pkgs takes one pull request per package version, checked
  # by its bots and reviewed by its moderators. The first version of a package
  # is a human-reviewed submission, so a missing token skips this job with a
  # warning instead of failing the release like update-homebrew does.
  update-winget:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the winget-pkgs token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WINGET_TOKEN}" ]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::WINGET_TOKEN is not set (a classic token with public_repo): not submitting this release to microsoft/winget-pkgs."
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout TARS repository
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: Set up Go
        if: steps.token.outputs.configured == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Render winget manifests
        if: steps.token.outputs.configured == 'true'
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
          SERVER_SHA: ${{ needs.publish-release.outputs.windows_sha }}
          DESKTOP_SHA: ${{ needs.publish-release.outputs.desktop_windows_sha }}
        run: |
          set -euo pipefail
          go run ./cmd/releasectl winget-manifests \
            --repo "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" \
            --server-sha "${SERVER_SHA}" \
            --desktop-sha "${DESKTOP_SHA}" \
            --out "${RUNNER_TEMP}/winget-manifests"

      - name: Open the winget-pkgs pull requests
        if: steps.token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.publish-release.outputs.version }}
        run: |
          set -euo pipefail
          login="$(gh api user --jq .login)"
          gh repo fork microsoft/winget-pkgs --clone=false
          gh repo sync "${login}/winget-pkgs" --source microsoft/winget-pkgs --branch master
          gh auth setup-git
          # The repository is several gigabytes; only the publisher's
          # manifests are needed.
          git clone --depth 1 --filter=blob:none --sparse "https://github.com/${login}/winget-pkgs.git" winget-pkgs
          git -C winget-pkgs sparse-checkout set manifests/d/Devlikebear
          git -C winget-pkgs config user.name "${login}"
          git -C winget-pkgs config user.email "${login}@users.noreply.github.com"

          # The app depends on the server, so winget-pkgs can only validate
          # its pull request once the server's is merged.
          for entry in "Devlikebear.TARS:d/Devlikebear/TARS" "Devlikebear.TARS.Desktop:d/Devlikebear/TARS/Desktop"; do
            id="${entry%%:*}"
            dir="${entry#*:}"
            branch="${id}-${VERSION}"
            if [ -n "$(gh pr list --repo microsoft/winget-pkgs --state open --author "${login}" --search "${id} version ${VERSION} in:title" --json number --jq '.[].number')" ]; then
              echo "${id} ${VERSION} already has an open pull request"
              continue
            fi
            kind="New version"
            if ! ls "winget-pkgs/manifests/${dir}" 2>/dev/null | grep -Eq '^[0-9]'; then
              kind="New package"
            fi
            git -C winget-pkgs switch --force-create "${branch}"
            mkdir -p "winget-pkgs/manifests/${dir}/${VERSION}"
            cp "${RUNNER_TEMP}/winget-manifests/${dir}/${VERSION}/"* "winget-pkgs/manifests/${dir}/${VERSION}/"
            git -C winget-pkgs add "manifests/${dir}/${VERSION}"
            git -C winget-pkgs commit -m "${kind}: ${id} version ${VERSION}"
            git -C winget-pkgs push --force origin "${branch}"
            gh pr create --repo microsoft/winget-pkgs --base master --head "${login}:${branch}" \
              --title "${kind}: ${id} version ${VERSION}" \
              --body "Release https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}, rendered by \`releasectl winget-manifests\`. The installer is a zip with a nested portable executable, so the server's \`share/\` directory stays next to \`tars.exe\`."
            git -C winget-pkgs switch --detach origin/master
          done
