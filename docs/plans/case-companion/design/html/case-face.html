<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASE · 미어캣 얼굴 (span + CSS 레퍼런스)</title>
<!--
  Phase 1 구현 레퍼런스. 이미지·SVG·폰트 아이콘 없이 span + CSS만으로 만든 미어캣 CASE.
  - .case-body 에 expr-<name> 클래스 하나로 표정 결정 (CompanionPet.svelte 의 기존 방식과 동일)
  - act-<name> 클래스로 1회 동작 (bounce/nod/shake/tilt/wave)
  - 상태색은 .case-gem (가슴 칩) 에만
  - prefers-reduced-motion: 애니메이션이 붙은 셀렉터를 모두 개별 나열
  좌표는 64×64 그리드 기준(px). 표시 크기는 --case-scale 로 조정.
-->
<link rel="stylesheet" href="../../../design-system/fonts.css">
<link rel="stylesheet" href="../../../design-system/tokens.css">
<style>
body{margin:0;background:var(--fm-ground);color:var(--fm-text);font-family:var(--fm-font-body)}

/* ── CASE figure ─────────────────────────────────────────── */
.case-figure{display:inline-block;--case-scale:2;width:calc(64px * var(--case-scale));height:calc(64px * var(--case-scale));position:relative;flex:none}
.case-body{position:absolute;left:0;top:0;width:64px;height:64px;transform:scale(var(--case-scale));transform-origin:0 0}
.case-body > span, .case-head > span{position:absolute;display:block}
.case-body .case-laptop,.case-body .case-paw,.case-body .case-zz,.case-head .case-brow,.case-head .case-mouth{display:none}

.case-ear{width:7px;height:7px;border-radius:50%;background:var(--case-ear);top:14.5px;transition:transform .2s}
.case-ear.l{left:15.5px}.case-ear.r{left:41.5px}
.case-torso{left:24px;top:43px;width:16px;height:17px;background:var(--case-torso)}
.case-gem{left:29px;top:50px;width:6px;height:4px;background:var(--case-gem-neutral)}
.case-laptop{left:20px;top:46px;width:24px;height:9px;background:#3a3a34;display:none}
.case-laptop::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:1.5px;background:var(--case-gem-working)}
.case-paw{left:42px;top:34px;width:4px;height:15px;background:var(--case-torso);border-radius:2px;transform:rotate(35deg);transform-origin:50% 100%;display:none}
.case-zz{right:9px;top:4px;font:600 8px/1 var(--fm-font-mono);color:var(--fm-text-3);display:none}

.case-head{position:absolute;left:20px;top:9px;width:24px;height:34px;transform-origin:50% 90%}
.case-skull{left:0;top:0;width:24px;height:34px;background:var(--case-head);border-radius:50% 50% 46% 46% / 40% 40% 60% 60%}
.case-patch{top:11.5px;width:9px;height:11px;border-radius:50%;background:var(--case-patch)}
.case-patch.l{left:2.5px}.case-patch.r{left:12.5px}
.case-eye{top:15px;width:4px;height:4px;border-radius:50%;background:var(--case-eye);transition:all .15s}
.case-eye.l{left:5px}.case-eye.r{left:15px}
.case-brow{top:8px;width:8px;height:2px;border-radius:1px;background:var(--case-patch);display:none}
.case-brow.l{left:2px}.case-brow.r{left:14px}
.case-nose{left:10px;top:25px;width:0;height:0;border-left:2px solid transparent;border-right:2px solid transparent;border-top:2.5px solid var(--case-nose)}
.case-mouth{left:9px;top:27.5px;width:6px;height:3px;border-bottom:1.5px solid var(--case-nose);border-radius:0 0 50% 50%;display:none}

/* ── expressions ─────────────────────────────────────────── */
/* working: 시선 아래 + 노트북 */
.expr-working .case-eye{width:3.6px;height:3.6px;transform:translate(-1px,2px)}
.expr-working .case-laptop{display:block}
.expr-working .case-gem{background:var(--case-gem-working)}

/* alert: 큰 눈 + 눈썹 올림 + 귀 위로 */
.expr-alert .case-eye{width:6px;height:6px;transform:translate(-1px,-1.5px)}
.expr-alert .case-brow{display:block}
.expr-alert .case-brow.l{transform:rotate(7deg)}.expr-alert .case-brow.r{transform:rotate(-7deg)}
.expr-alert .case-ear{transform:translateY(-2px)}
.expr-alert .case-gem{background:var(--case-gem-alert)}

/* happy: ∩ 눈 + 미소 */
.expr-happy .case-eye,.expr-greeting .case-eye.l{width:5px;height:3px;background:transparent;border-top:2px solid var(--case-eye);border-radius:50% 50% 0 0;transform:translate(-0.5px,0.5px)}
.expr-happy .case-mouth,.expr-greeting .case-mouth{display:block}
.expr-happy .case-gem{background:var(--case-gem-happy)}

/* upset: 작은 눈 + 안쪽으로 처진 눈썹 + 처진 입 */
.expr-upset .case-eye{width:3.4px;height:3.4px;transform:translate(0.3px,1px)}
.expr-upset .case-brow{display:block;top:9px}
.expr-upset .case-brow.l{transform:rotate(22deg)}.expr-upset .case-brow.r{transform:rotate(-22deg)}
.expr-upset .case-mouth{display:block;top:29px;border-bottom:none;border-top:1.5px solid var(--case-nose);border-radius:50% 50% 0 0}
.expr-upset .case-gem{background:var(--case-gem-alert)}

/* wary: 가늘게 뜬 눈 + 곁눈질 + 비스듬한 눈썹 */
.expr-wary .case-eye{width:4.4px;height:2.2px;transform:translate(1.5px,1px)}
.expr-wary .case-brow{display:block;top:10px;width:9px}
.expr-wary .case-brow.l{transform:rotate(10deg)}.expr-wary .case-brow.r{transform:rotate(-10deg)}
.expr-wary .case-gem{background:var(--case-gem-working)}

/* sleepy: 감은 눈 + z + 살짝 기움 */
.expr-sleepy .case-eye{width:5px;height:2px;border-radius:1px;transform:translate(-0.5px,1.5px)}
.expr-sleepy .case-zz{display:block}
.expr-sleepy .case-head{transform:rotate(-5deg)}
.expr-sleepy .case-gem{background:var(--case-gem-sleepy)}

/* greeting: 윙크 + 앞발 + 미소 */
.expr-greeting .case-eye.r{width:4.4px;height:4.4px}
.expr-greeting .case-paw{display:block}
.expr-greeting .case-gem{background:var(--case-gem-happy)}

/* ── actions (1회) ───────────────────────────────────────── */
@keyframes case-bounce{0%,100%{transform:scale(var(--case-scale)) translateY(0)}30%{transform:scale(var(--case-scale)) translateY(-4px)}60%{transform:scale(var(--case-scale)) translateY(0)}80%{transform:scale(var(--case-scale)) translateY(-1.5px)}}
@keyframes case-shake{0%,100%{transform:scale(var(--case-scale)) translateX(0)}20%,60%{transform:scale(var(--case-scale)) translateX(-1.5px)}40%,80%{transform:scale(var(--case-scale)) translateX(1.5px)}}
@keyframes case-tilt{0%,100%{transform:scale(var(--case-scale)) rotate(0)}50%{transform:scale(var(--case-scale)) rotate(-6deg)}}
@keyframes case-nod{0%,100%{transform:rotate(0)}35%{transform:rotate(8deg)}70%{transform:rotate(-2deg)}}
@keyframes case-wave{0%,100%{transform:rotate(35deg)}25%{transform:rotate(10deg)}50%{transform:rotate(40deg)}75%{transform:rotate(10deg)}}
.case-body.act-bounce{animation:case-bounce .7s ease-out 1}
.case-body.act-shake{animation:case-shake .5s ease-in-out 1}
.case-body.act-tilt{animation:case-tilt 1.2s ease-in-out 1}
.case-body.act-nod .case-head{animation:case-nod .8s ease-in-out 1}
.case-body.act-wave .case-paw{animation:case-wave 1.2s ease-in-out 2}

@media (prefers-reduced-motion: reduce){
  .case-body.act-bounce,
  .case-body.act-shake,
  .case-body.act-tilt,
  .case-body.act-nod .case-head,
  .case-body.act-wave .case-paw{animation:none}
  .case-ear,.case-eye{transition:none}
}

/* ── demo page ───────────────────────────────────────────── */
.wrap{max-width:1200px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.lbl{font-family:var(--fm-font-label);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fm-text-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));border-top:1px solid var(--fm-line);border-left:1px solid var(--fm-line)}
.cell{display:flex;gap:16px;align-items:center;padding:18px;border-right:1px solid var(--fm-line);border-bottom:1px solid var(--fm-line)}
.tile{background:var(--fm-surface-2);padding:0}
.meta{display:flex;flex-direction:column;gap:4px;font-size:13px}
.meta code{font-family:var(--fm-font-mono);font-size:13px;color:var(--fm-text)}
.meta span{color:var(--fm-text-2)}
button{height:28px;padding:0 10px;border:1px solid var(--fm-line-strong);background:transparent;color:var(--fm-text);font:12px var(--fm-font-body);cursor:pointer}
.bg-row{display:flex;gap:16px;flex-wrap:wrap}
.bg{display:flex;align-items:center;gap:14px;padding:16px 20px;border:1px solid var(--fm-line)}
</style>
</head>
<body>
<div class="wrap">
<div><span class="lbl">CASE · Phase 1 reference</span><h1>미어캣 얼굴 — span + CSS만으로</h1></div>
<p style="margin:0;color:var(--fm-text-2);font-size:14px;max-width:760px">버튼을 누르면 해당 표정의 동작(act-*)이 1회 재생됩니다. 시스템의 “동작 줄이기”를 켜면 동작은 멈추고 표정 모양만 남습니다. 마크업은 아래 <code>template</code>와 같고, 표정은 <code>.case-body</code>의 클래스 하나로만 바뀝니다.</p>

<div class="grid" id="grid"></div>

<div><span class="lbl">배경 대비 확인 (Monolith / 현재 Graphite / 밝은 배경)</span></div>
<div class="bg-row" id="bgs"></div>
</div>

<template id="case-tpl">
<span class="case-figure">
  <span class="case-body">
    <span class="case-ear l"></span><span class="case-ear r"></span>
    <span class="case-torso"></span>
    <span class="case-laptop"></span>
    <span class="case-head">
      <span class="case-skull"></span>
      <span class="case-brow l"></span><span class="case-brow r"></span>
      <span class="case-patch l"></span><span class="case-patch r"></span>
      <span class="case-eye l"></span><span class="case-eye r"></span>
      <span class="case-nose"></span>
      <span class="case-mouth"></span>
    </span>
    <span class="case-paw"></span>
    <span class="case-gem"></span>
    <span class="case-zz">z</span>
  </span>
</span>
</template>

<script>
const EXPR = [
  ['neutral','평상시 · 아무 일 없음',''],
  ['working','다른 세션 턴 실행 중',''],
  ['alert','승인 대기 · 게이트 열림','bounce'],
  ['happy','턴·파이프라인 완료','nod'],
  ['upset','실패 · 막힘','shake'],
  ['wary','경고 이벤트','tilt'],
  ['sleepy','5분 이상 입력 없음',''],
  ['greeting','도착 · 오래 비운 뒤','wave'],
];
const tpl = document.getElementById('case-tpl');
function make(expr, scale){
  const n = tpl.content.firstElementChild.cloneNode(true);
  n.style.setProperty('--case-scale', scale);
  n.querySelector('.case-body').classList.add('expr-' + expr);
  return n;
}
const grid = document.getElementById('grid');
for (const [e, when, act] of EXPR){
  const cell = document.createElement('div'); cell.className = 'cell';
  const tile = document.createElement('div'); tile.className = 'tile';
  const fig = make(e, 2); tile.appendChild(fig); cell.appendChild(tile);
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.innerHTML = `<code>expr-${e}</code><span>${when}</span>`;
  if (act){
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'act-' + act;
    b.onclick = () => { const body = fig.querySelector('.case-body'); body.classList.remove('act-' + act); void body.offsetWidth; body.classList.add('act-' + act); };
    meta.appendChild(b);
  }
  cell.appendChild(meta); grid.appendChild(cell);
}
const bgs = document.getElementById('bgs');
for (const [bg, label, fg] of [['#0f0f0e','Monolith','#eceae4'],['#14171a','Graphite (현행 콘솔)','#e6e9ec'],['#f3f2ee','Light','#16171a']]){
  const d = document.createElement('div'); d.className = 'bg'; d.style.background = bg; d.style.color = fg;
  for (const e of ['neutral','alert','happy','sleepy']) d.appendChild(make(e, 1.25));
  const s = document.createElement('span'); s.textContent = label; s.style.fontSize = '12px'; d.appendChild(s);
  bgs.appendChild(d);
}
</script>
</body>
</html>
