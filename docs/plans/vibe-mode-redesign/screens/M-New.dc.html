<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9aa4ad}a:hover{color:#e6e9ec}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0d0f11; color: #e6e9ec; font-family: 'IBM Plex Sans KR', 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding-top: 54px">
  <div style="padding: 8px 20px 0; display: flex; align-items: center">
    <a href="M-Projects.dc.html" style="text-decoration: none; font-size: 15px; padding: 10px 10px 10px 0">닫기</a>
  </div>
  <div style="flex-grow: 1; padding: 10px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600">무엇을 만들까요?</h1>
    <div style="background: #14171a; border: 1px solid #3ee07f; border-radius: 8px; box-shadow: 0 0 0 4px rgba(62,224,127,0.08); padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <label for="idea" style="font-size: 13px; color: #9aa4ad">한두 문장이면 돼요. 빠진 건 리더봇이 물어봐요.</label>
      <textarea id="idea" style="border: 0; outline: none; resize: none; font: inherit; font-size: 18px; line-height: 1.5; height: 112px; background: transparent; color: #e6e9ec">우리 동네 독서모임 신청 페이지, 신청한 사람 목록도 보이게</textarea>
      <div style="display: flex; align-items: center; gap: 10px; border-top: 1px solid #1f2428; padding-top: 12px">
        <button aria-label="말로 입력하기" style="width: 44px; height: 44px; font: inherit; color: #e6e9ec; border: 1px solid #3a4148; background: #21262b; border-radius: 50%; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <span style="font-size: 12px; color: #9aa4ad">말로 해도 돼요</span>
      </div>
    </div>

    <div style="background: #14171a; border: 1px solid #2b3137; border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-size: 14px">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #3ee07f"></span>
      <span style="flex-grow: 1">집 맥북에서 만들어요<br><span style="font-size: 12px; color: #9aa4ad">켜져 있고 AI에 연결돼 있어요</span></span>
      <a href="M-Pair.dc.html" style="font-size: 13px; text-decoration: none">바꾸기</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #9aa4ad">이런 걸로 시작해 보세요</span>
      <button style="font: inherit; font-size: 15px; color: #e6e9ec; text-align: left; background: #14171a; border: 1px solid #2b3137; border-radius: 8px; padding: 14px 16px">체크할 수 있는 할 일 목록</button>
      <button style="font: inherit; font-size: 15px; color: #e6e9ec; text-align: left; background: #14171a; border: 1px solid #2b3137; border-radius: 8px; padding: 14px 16px">메뉴와 영업시간이 있는 카페 소개</button>
      <button style="font: inherit; font-size: 15px; color: #e6e9ec; text-align: left; background: #14171a; border: 1px solid #2b3137; border-radius: 8px; padding: 14px 16px">투표하고 결과를 보는 페이지</button>
    </div>

    <div style="font-size: 12px; color: #9aa4ad; line-height: 1.6; border-left: 2px solid #2b3137; padding-left: 12px">컴퓨터가 꺼져 있으면 버튼이 <b style="color: #e6e9ec; font-weight: 600">아이디어로 저장해 두기</b>로 바뀌어요. 컴퓨터가 켜지면 알려 드리고, 그때 한 번 눌러 보내요.</div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 34px; background: #14171a; border-top: 1px solid #1f2428; display: flex; flex-direction: column; gap: 8px">
    <a href="M-Paused.dc.html" style="text-decoration: none; text-align: center; font-size: 17px; font-weight: 600; background: #3ee07f; color: #06140c; border-radius: 8px; padding: 15px">팀에게 맡기기</a>
    <span style="font-size: 12px; color: #9aa4ad; text-align: center">웹 페이지와 웹 앱 · 보통 10~20분</span>
  </div>
</div>
