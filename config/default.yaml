runtime:
  workspace_dir: ./workspace
  style:
    directness_default: 70
    humor_default: 20
    caution_default: 60
    autonomy_default: 40

llm:
  # ---- LLM provider pool ----
  # Each alias defines "where to call + how to authenticate" — no model
  # here. At minimum one provider must be defined. Credentials come
  # from environment variables. Supported kinds: anthropic, openai,
  # kimi, openai-codex, gemini, gemini-native, claude-code-cli,
  # antigravity-cli.
  providers:
    codex:
      kind: openai-codex
      auth_mode: oauth
      base_url: https://chatgpt.com/backend-api
    minimax:
      kind: anthropic
      auth_mode: api-key
      api_key: ${MINIMAX_API_KEY}
      base_url: https://api.minimax.io/anthropic

  # ---- Tier bindings ----
  # Each tier binds to one provider alias + model + optional knobs.
  # All three tiers (heavy/standard/light) must be configured. Mix
  # multiple providers by adding entries above and referencing them
  # here — e.g. `provider: codex` for a second alias.
  #
  # max_tokens and beta_features are available per tier; see
  # config/tars.config.example.yaml for what they do. Neither is set
  # here: gateway-hosted models like MiniMax below have no documented
  # output ceiling for TARS to default from, and picking one for
  # someone else's endpoint is a guess. Set max_tokens explicitly on
  # such a tier to lift it off the conservative 4096 fallback.
  tiers:
    heavy:
      provider: codex
      model: gpt-5.4
      reasoning_effort: high
      service_tier: priority
    standard:
      provider: codex
      model: gpt-5.4
      reasoning_effort: medium
      service_tier: priority
    light:
      provider: minimax
      model: MiniMax-M2.7
      reasoning_effort: minimal

  default_tier: standard

  # ---- Role → tier mapping (optional) ----
  # Roles absent from this map fall back to llm.default_tier. Role
  # names are validated at router build time — see internal/llm/role.go
  # for the canonical list.
  role_defaults:
    chat_main: standard
    context_compactor: light
    memory_hook: light
    reflection_memory: light
    pulse_decider: light
    session_cleanup: light
    agentruntime_default: standard
    agentruntime_planner: heavy
    critic: standard

automation:
  agent:
    max_iterations: 8

work_ledger:
  enabled: true
  scheduler:
    enabled: false
    max_workers: 4
    lease_seconds: 60
    heartbeat_seconds: 20
    poll_milliseconds: 250
    execution_environment: local
    execution_data_dir: $HOME/.tars/execution-plane
    artifact_paths: []
    external_harness:
      config_path: ""
    remote_workers:
      enabled: false
      gateway_config_path: ""
    a2a:
      enabled: false
      discovery_url: ""
      bearer_token: ""
      allowed_hosts: []
      allow_private_hosts: false
      allow_insecure_loopback: false
      poll_milliseconds: 2000
      max_poll_seconds: 1800

companion:
  enabled: true

embodiment:
  enabled: false
  providers: []
