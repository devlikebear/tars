# tars annotated example configuration
# Usage:
#   tars init                         # preferred starter path for packaged installs
#   tars doctor --fix                 # create starter files and check BYOK readiness
#   tars service install && tars service start
#   go run ./cmd/tars serve --config ./config/tars.config.example.yaml --config-check
#   go run ./cmd/tars serve --config ./config/tars.config.example.yaml
# Health check endpoint: GET /v1/healthz
#
# `config/default.yaml` is the minimal active default that ships with TARS.
# This file mirrors every supported field with the value you would get if
# you said nothing — use it as a reference, not as the runtime config.

runtime:
  workspace_dir: ./workspace
  session:
    default_id: ""
    telegram_scope: main
  style:
    # Global defaults for per-session TARS style sliders.
    directness_default: 70
    humor_default: 20
    caution_default: 60
    autonomy_default: 40

log:
  level: info
  file: ""
  rotate:
    max_size_mb: 100
    max_days: 30
    max_backups: 5

api:
  auth_mode: required
  auth_token: ""
  user_token: ""
  admin_token: ""
  allow_insecure_local_auth: false
  max_inflight:
    chat: 2
    agent_runs: 4
  dashboard:
    auth_mode: inherit

llm:
  # See internal/llm/role.go for the canonical role list. Each tier binds
  # one provider alias + one model — credentials live at the provider
  # level so multiple tiers can share the same alias.
  #
  # reasoning_effort accepts none | minimal | low | medium | high. It is a
  # provider-agnostic hint, so each provider renders it in its own terms.
  # On kind: anthropic it renders two different ways, because the models
  # split into two generations with mutually exclusive request shapes —
  # sending the wrong one is rejected outright, not degraded.
  #
  # Adaptive generation — Opus 4.7 / 4.8 / 5, Sonnet 5, Fable 5, Mythos 5.
  # The level maps onto the model's own effort control:
  #
  #   none     thinking off (Fable and Mythos always think; the setting is
  #            reported as unhonored rather than sent and rejected)
  #   minimal  low   (Anthropic has no band below "low")
  #   low      low
  #   medium   medium
  #   high     high
  #
  # thinking_budget cannot be expressed on these models and is rejected at
  # startup — use reasoning_effort.
  #
  # Budget generation — Haiku 4.5, Sonnet 4.5, Opus 4.5/4.6, Sonnet 4.6,
  # and every gateway-hosted model. The level becomes a thinking budget:
  #
  #   none     thinking off
  #   minimal  1024 tokens (the provider floor)
  #   low      2048
  #   medium   8192
  #   high     16384
  #
  # That budget is clamped to leave 1024 tokens of max_tokens for the
  # answer, so raising max_tokens is what lifts the clamp. thinking_budget,
  # where set, is the more specific knob and outranks reasoning_effort.
  # Third-party gateways served over the Anthropic protocol are treated as
  # budget generation, since that is the shape they were built against; one
  # that does not implement extended thinking may reject or ignore it.
  #
  # max_tokens caps the response length. Left unset, a tier gets a
  # conservative default (16000 on models TARS recognizes, 4096 on those
  # it does not — every gateway-hosted model, notably). That default is
  # deliberately below the models' documented 128000 ceiling: TARS shares
  # one 30s HTTP timeout across streaming and non-streaming calls, and the
  # one-shot and background paths do not stream, so a high default turns a
  # clean truncation into a timeout. Set max_tokens explicitly to go
  # higher — nothing caps an explicit value. Setting both max_tokens and
  # thinking_budget where the budget is not strictly smaller fails at
  # startup rather than at request time.
  #
  # beta_features opts the tier into provider beta features. On
  # kind: anthropic the values are joined into one anthropic-beta header;
  # leave the list out and no header is sent at all, which is what a
  # third-party gateway wants. Values are passed through verbatim and are
  # not validated against a list, so a newly announced flag needs no TARS
  # release. CLI-backed providers (claude-code-cli, antigravity-cli) own
  # their own request shape and ignore both knobs.
  providers:
    default:
      kind: anthropic
      auth_mode: api-key
      base_url: https://api.anthropic.com
      api_key: ${ANTHROPIC_API_KEY}
  tiers:
    heavy:
      provider: default
      model: claude-opus-4-7
      reasoning_effort: high
      # Raise the ceiling above the model default, and opt into 1M context.
      max_tokens: 64000
      beta_features:
        - context-1m-2025-08-07
    standard:
      provider: default
      model: claude-sonnet-4-6
      reasoning_effort: medium
    light:
      provider: default
      model: claude-haiku-4-5-20251001
      reasoning_effort: minimal
  default_tier: standard
  role_defaults:
    chat_main: standard
    context_compactor: light
    memory_hook: light
    reflection_memory: light
    reflection_kb: light
    pulse_decider: light
    session_cleanup: light
    agentruntime_default: standard
    agentruntime_planner: heavy
    critic: standard

  # Only relevant when a tier uses kind: claude-code-cli. Controls the value
  # passed to `claude -p --permission-mode`. Allowed values:
  #   auto              — Claude Code prompts interactively for risky tools (default)
  #   default           — use Claude Code's standard permission behavior
  #   acceptEdits       — auto-approve file edits, still prompt for shell/network
  #   plan              — analysis only; refuse to edit or execute
  #   dontAsk           — deny any permission that was not explicitly allowed
  #   bypassPermissions — disable all prompts (use with care)
  # Empty / unknown values degrade to "auto" inside the provider.
  claude_code_cli:
    permission_mode: auto

memory:
  backend: file
  semantic:
    enabled: false
  embed:
    provider: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key: ${GEMINI_API_KEY}
    model: gemini-embedding-2-preview
    dimensions: 768

usage:
  limits:
    daily_usd: 10
    weekly_usd: 50
    monthly_usd: 150
    daily_tokens: 0
    mode: soft
  price_overrides: {}

automation:
  agent:
    # Max tool-call iterations the chat agent loop runs before forcing a
    # final response. Bump this for multi-step workflows that chain many
    # exec/edit/test calls (e.g. github-flow style implementations).
    max_iterations: 20
  pulse:
    enabled: true
    interval: 1m
    timeout: 2m
    active_hours: "00:00-24:00"
    timezone: Local
    min_severity: warn
    allowed_autofixes:
      - compress_old_logs
      - auto_continue_chat
      # cleanup_stale_tmp is available only when explicitly added here;
      # cleanup-like changes should normally flow through Approvals.
    notify_telegram: false
    notify_session_events: true
    cron_failure_threshold: 3
    stuck_run_minutes: 60
    disk_warn_percent: 85
    disk_critical_percent: 95
    delivery_failure_threshold: 3
    delivery_failure_window: 10m
    reflection_failure_threshold: 3
  reflection:
    enabled: true
    sleep_window: "02:00-05:00"
    timezone: Local
    tick_interval: 5m
    empty_session_age: 24h
    memory_lookback_hours: 24
    max_turns_per_session: 20
  cron:
    run_history_limit: 200
  notify:
    command: ""
    when_no_clients: true
  schedule:
    timezone: Asia/Seoul

assistant:
  enabled: true
  hotkey: "Ctrl+Option+Space"
  whisper_bin: whisper-cli
  ffmpeg_bin: ffmpeg
  tts_bin: say

companion:
  # Shows the always-floating Console companion. It is visual-only in this
  # version; proactive suggestion/speech loops stay separately gated.
  enabled: true

embodiment:
  enabled: false
  providers: []
  # Provider examples. Capability values:
  # vision, hearing, speech, expression, motion, led.
  # MCP provider endpoints name the MCP server used for action egress.
  #
  # providers:
  #   - name: stackchan
  #     enabled: true
  #     transport: mcp
  #     endpoint: tars-stackchan
  #     capabilities: [vision, hearing, speech, expression, motion, led]
  #     session_id: sess_main
  #     owner_only_directive: true
  #     salience_min_sound_level: 0.6
  #     min_trigger_interval: 30s
  #     max_triggers_per_hour: 60
  #   - name: host
  #     enabled: true
  #     transport: mcp
  #     endpoint: tars-stackchan-host
  #     capabilities: [hearing, speech]
  #     session_id: sess_main
  #     owner_only_directive: false
  #     salience_min_sound_level: 0.6
  #     trigger_observations: true
  #     min_trigger_interval: 30s
  #     max_triggers_per_hour: 60

compaction:
  trigger_tokens: 100000
  keep_recent_tokens: 12000
  keep_recent_fraction: 0.30
  llm_mode: auto
  llm_timeout_seconds: 15

tools:
  default_set: standard
  allow_high_risk_user: false
  exec:
    # Upper bound on a single exec tool invocation, in milliseconds. The
    # LLM can pass a smaller `timeout_ms` per call but values above this
    # are clamped. Raise this for builds, installs, and CI waits; lower
    # it to tighten the maximum wall time a single shell command can run.
    max_timeout_ms: 300000
  process:
    # Upper bound on background commands (exec with background:true) and
    # on the per-call timeout the process tool's `wait` action will honor.
    # Independent of tools.exec.max_timeout_ms so long-running watchers
    # like `gh pr checks --watch` can run for tens of minutes.
    max_timeout_ms: 1800000
  web_search:
    enabled: false
    provider: brave
    api_key: ""
    cache_ttl_seconds: 60
    perplexity:
      api_key: ""
      model: sonar
      base_url: https://api.perplexity.ai/chat/completions
  web_fetch:
    enabled: false
    allow_private_hosts: false
    private_host_allowlist:
      - localhost
      - 127.0.0.1
  apply_patch:
    enabled: false
  message:
    enabled: false
  nodes:
    enabled: false
  agentruntime:
    enabled: false

# Additive durable projection for sessions, tasks, attempts, and proofs.
# Set false (or TARS_WORK_LEDGER_ENABLED=false) and restart to return to
# untouched legacy session and Agent Runtime files without deleting SQLite.
work_ledger:
  enabled: true
  # Durable scheduler can be rolled back independently without deleting the ledger.
  scheduler:
    enabled: false
    max_workers: 4
    lease_seconds: 60
    heartbeat_seconds: 20
    poll_milliseconds: 250
    # local preserves existing behavior; managed-worktree requires a Git repository.
    execution_environment: local
    # Must be outside workspace_dir. Stores resumable state, managed worktrees,
    # and redacted copies of configured artifacts with private permissions.
    execution_data_dir: $HOME/.tars/execution-plane
    # Relative paths/globs only. Sensitive names, symlinks, .git, .tars, and
    # node_modules are excluded by the collector.
    artifact_paths: []
    # Optional Claude Code Execution Plane adapter. Disabled when blank.
    # The JSON file must be an absolute path outside workspace_dir, a regular
    # owner-only file (0600), and use the bounded schema documented in
    # docs/agent-harness/execution-plane.md. The adapter reuses the local
    # Claude login and may send the Work/Step prompt and allowed repository
    # content to Anthropic. It always runs in a disposable managed worktree.
    external_harness:
      config_path: ""
    # Remote workers use the same durable scheduler and are opt-in. Controller
    # state is kept below execution_data_dir/remote-workers/controller.json.
    remote_workers:
      enabled: false
      # Optional absolute path to an owner-only (0600) gateway JSON config.
      # Setting it registers a durable remote/container scheduler adapter.
      gateway_config_path: ""
    # A2A is an external interoperability adapter only. It never replaces the
    # Work Ledger, MCP, or TARS' internal worker protocol.
    a2a:
      enabled: false
      discovery_url: "" # HTTPS origin with /.well-known/agent-card.json
      bearer_token: "" # Prefer ${TARS_WORK_SCHEDULER_A2A_BEARER_TOKEN}
      allowed_hosts: []
      allow_private_hosts: false
      allow_insecure_loopback: false # development only
      poll_milliseconds: 2000
      max_poll_seconds: 1800

agentruntime:
  enabled: false
  default_agent: ""
  agents:
    list:
      - name: worker
        description: external worker
        command: python3
        args: ["./path/to/worker_agent.py"]
        working_dir: .
        timeout_seconds: 120
        enabled: true
    watch: true
    watch_debounce_ms: 200
  task_override:
    enabled: false
    allowed_aliases: []
    allowed_models: []
  persistence:
    enabled: true
    dir: ./workspace/_shared/agentruntime
  runs:
    persistence_enabled: true
    max_records: 2000
  channels:
    persistence_enabled: true
    max_messages_per_channel: 500
  subagents:
    max_threads: 4
    max_depth: 1
  # Advanced opt-in. When false, mode=consensus is hidden from the default subagents_run tool schema.
  consensus:
    enabled: false
    max_fanout: 3
    budget_tokens: 20000
    budget_usd: 0.50
    timeout_seconds: 120
    allowed_aliases: []
    concurrent_runs: 1
  restore_on_startup: true
  report:
    summary_enabled: true
  archive:
    enabled: false
    dir: ./workspace/_shared/agentruntime/archive
    retention_days: 30
    max_file_bytes: 10485760

channels:
  local:
    enabled: false
  webhook:
    enabled: false
  telegram:
    enabled: false
    dm_policy: pairing
    polling:
      enabled: true
    bot_token: ""

extensions:
  skills:
    enabled: true
    watch: true
    watch_debounce_ms: 200
    bundled_dir: ./skills
    extra_dirs: []
  # External Go plugins are deprecated (RF-007/009). Builtin plugins were
  # removed entirely; manifests can only declare mcp_servers and require
  # `allow_mcp_servers: true` to load. Prefer skills + companion CLI.
  plugins:
    enabled: true
    watch: true
    watch_debounce_ms: 200
    bundled_dir: ./plugins
    extra_dirs: []
    allow_mcp_servers: false
  mcp:
    command_allowlist:
      - npx
    servers:
      - name: filesystem
        command: npx
        args:
          - -y
          - '@modelcontextprotocol/server-filesystem'
          - .
